<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WARP-RM Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
  rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">WARP-RM <span>inspector</span></div>

  <label class="inline-field">
    <span>source</span>
    <select id="signal-source" title="ckpt: live inference from the loaded checkpoint. sidecar: read warp_rm_* columns straight from the dataset's parquets (no ckpt needed).">
      <option value="ckpt" selected>ckpt inference</option>
      <option value="sidecar">injected sidecar</option>
    </select>
  </label>

  <label class="inline-field">
    <span>ckpt</span>
    <select id="ckpt-select"></select>
  </label>

  <div class="inline-field">
    <span>datasets</span>
    <button id="dataset-toggle" class="picker-btn" type="button">
      <span id="dataset-summary">none</span>
      <span class="caret">▾</span>
    </button>
  </div>

  <label class="inline-field">
    <span>camera</span>
    <select id="camera-select" title="Video feature key to score. Options are the video keys common to every selected dataset (from meta/info.json)."></select>
  </label>

  <div class="inline-field rabc-field" title="Visualize the per-frame weight a downstream WARP-BC sample would receive under the selected weighting scheme">
    <label class="num"><span>scheme</span>
      <select id="rabc-mode">
        <option value="off">off</option>
        <option value="velocity_only">velocity_only</option>
      </select>
    </label>
    <label class="num"><span>clip min</span>
      <input id="rabc-clip-min" type="number" step="0.05" value="0" />
    </label>
    <label class="num"><span>clip max</span>
      <input id="rabc-clip-max" type="number" step="0.05" value="1" />
    </label>
    <label class="num"><span>thresh min</span>
      <input id="rabc-thresh" type="number" step="0.05" placeholder="off" />
    </label>
  </div>

  <div id="status" class="status">idle</div>
</header>

<div id="dataset-popover" class="popover" hidden>
  <div class="popover-head">
    <input id="dataset-search" type="search" placeholder="filter by name" />
    <button id="dataset-clear" class="linkish" type="button">clear</button>
  </div>
  <div id="dataset-list" class="popover-list"></div>
</div>

<main class="grid">
  <aside class="episodes">
    <div class="panel-head">
      <div class="panel-title">episodes</div>
      <div class="controls">
        <input id="episode-search" type="search" placeholder="idx" />
        <select id="episode-sort">
          <option value="length_asc">↑ length</option>
          <option value="length_desc">↓ length</option>
          <option value="velocity_asc">↑ mean velocity</option>
          <option value="velocity_desc">↓ mean velocity</option>
          <option value="idx_asc">↑ idx</option>
        </select>
      </div>
    </div>
    <div id="episode-list" class="episode-list"></div>
    <div id="episode-footer" class="panel-foot"></div>
  </aside>

  <section class="video-col">
    <div class="video-head">
      <div id="video-title">—</div>
      <div id="video-meta" class="muted"></div>
    </div>
    <video id="video" controls preload="auto"></video>
    <div class="frame-strip">
      <span id="frame-label">frame —</span>
      <span id="time-label" class="muted">0:00.00</span>
      <span id="weight-label" class="weight-pill">w —</span>
      <span id="stats" class="muted stats-inline"></span>
    </div>
  </section>

  <section class="plots">
    <div class="plot-wrap"><div id="plot-progress" class="plot"></div><div class="plot-cursor" id="cursor-progress"></div></div>
    <div class="plot-wrap"><div id="plot-velocity" class="plot"></div><div class="plot-cursor" id="cursor-velocity"></div></div>
    <div class="plot-wrap"><div id="plot-zoom"     class="plot"></div><div class="plot-cursor" id="cursor-zoom"></div></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
